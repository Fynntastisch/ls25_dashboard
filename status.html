<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS25 Status</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--soil:#2b2118;--field:#4f6b3a;--barn:#8c3b2a;--hay:#e0b43a;--paper:#f3efe4;--ink:#241c14}
body{background:linear-gradient(rgba(243,239,228,.9),rgba(243,239,228,.9)),url(img/bg.jpg) center/cover fixed;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--soil);color:#f3efe4;border-bottom:4px solid var(--hay)}
.topbar .btn-outline-light{--bs-btn-border-color:#8a7a66}
.brand{font-weight:700}
.btn-hay{background:var(--hay);border-color:var(--hay);color:var(--ink);font-weight:600}
.btn-hay:hover{background:#c9a02e;border-color:#c9a02e}
.btn:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.panel{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1)}
.table th{font-weight:600;color:#6b5d4d;border-bottom-color:var(--soil)}
.role{border-radius:4px;padding:.1rem .5rem;font-size:.85rem;font-weight:600;background:#efe9d8}
.role.chef{background:var(--soil);color:var(--hay)}
.role.dev{background:var(--field);color:#fff}
.role.test{background:var(--barn);color:#fff}
.post{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1);padding:1.25rem 1.5rem;margin-bottom:1rem}
.post h2{font-size:1.35rem}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere}
.post-tile{cursor:pointer;transition:transform .15s}
.post-tile:hover{transform:translateY(-2px)}
.post-tile:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.preview{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#4a3f33;overflow-wrap:anywhere}
#rBody{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18110a">
<link rel="icon" type="image/png" href="img/icons/icon-192.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elmcreek">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<div id="topbar"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap align-items-center gap-3 mb-3 toolbar">
    <div class="page-head me-auto"><span class="page-icon"><i class="bi bi-activity" aria-hidden="true"></i></span><div><h1 class="h3 mb-0">Datenbank-Status</h1><div class="page-sub">Zustand und Auslastung von Supabase.</div></div></div>
    <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="auto"><label class="form-check-label" for="auto">Alle 30 Sekunden aktualisieren</label></div>
    <button class="btn btn-hay" onclick="load()"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Jetzt prüfen</button>
  </div>
  <div id="statusWrap"></div>
  <div class="small mt-3" style="color:rgba(255,255,255,.7)" id="checked"></div>
</main>
<div class="status-overlay" id="overlay" role="status" hidden><span class="spinner-border spinner-border-sm text-warning" aria-hidden="true"></span> Status wird geprüft …</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/version.js"></script>
<script src="js/pwa.js"></script>
<script>
let data,me,timer=null,busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logout(){sb.auth.signOut().then(()=>location.href='index.html')}
const MB=1024*1024;
const fmtBytes=b=>b==null?'–':b>=1024**3?(b/1024**3).toFixed(2)+' GB':b>=MB?(b/MB).toFixed(1)+' MB':b>=1024?Math.round(b/1024)+' KB':b+' B';
const fmtDur=ms=>{const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60);return d?`${d} Tg. ${h} Std.`:h?`${h} Std. ${m%60} Min.`:`${m} Min.`};
const fmtDate=d=>d?new Date(d).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–';
const colorFor=p=>p>=90?'#e5484d':p>=70?'#f0b429':'#3ecf8e';

function ring(pct,label,sub){
  const r=46,c=2*Math.PI*r,p=Math.max(0,Math.min(100,pct)),off=c*(1-p/100);
  return `<svg viewBox="0 0 120 120" class="ring" role="img" aria-label="${esc(label)}: ${p.toFixed(1)} Prozent belegt">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${colorFor(p)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
    <text x="60" y="62" text-anchor="middle" class="ring-pct">${Math.round(p)}%</text>
    <text x="60" y="80" text-anchor="middle" class="ring-sub">${esc(sub)}</text></svg>`;
}
async function timed(fn){const t=performance.now();try{const r=await fn();return {ok:true,ms:Math.round(performance.now()-t),r}}catch(e){return {ok:false,ms:Math.round(performance.now()-t),err:e}}}

function serviceCard(name,icon,res,note){
  const cls=!res.ok?'bad':res.ms>1500?'warn':'ok';
  const txt=!res.ok?'Nicht erreichbar':res.ms>1500?'Langsam':'Online';
  return `<div class="col-md-4"><div class="panel p-3 h-100"><div class="d-flex align-items-center gap-2 mb-1"><i class="bi bi-${icon}" aria-hidden="true"></i><strong>${name}</strong><span class="ms-auto d-flex align-items-center gap-2"><span class="status-dot ${cls}" aria-hidden="true"></span>${txt}</span></div>
    <div class="small text-secondary">${res.ok?`Antwortzeit ${res.ms} ms`:esc(res.err&&res.err.message||'Fehler')}${note?` · ${esc(note)}`:''}</div></div></div>`;
}
function gaugeCard(title,pct,used,total,note){
  return `<div class="col-md-4"><div class="panel p-3 text-center h-100"><h2 class="h6 mb-2">${title}</h2>${ring(pct,title,note)}
    <div class="mt-2 fw-semibold">${used} von ${total}</div><div class="small text-secondary">${pct>=100?'voll':'noch frei: '+fmtFree(total,used,pct)}</div></div></div>`;
}
const fmtFree=(total,used,pct)=>total.replace(/[\d.,]+/,m=>{const t=parseFloat(m.replace(',','.'));return (t*(1-pct/100)).toFixed(t>=10?0:1).replace('.',',')});
const fact=(icon,label,value,sub)=>`<div class="col-6 col-md-4 col-lg-3"><div class="panel p-3 h-100"><div class="small text-secondary mb-1"><i class="bi bi-${icon} me-1" aria-hidden="true"></i>${label}</div><div class="fact-n">${value}</div>${sub?`<div class="small text-secondary">${sub}</div>`:''}</div></div>`;

function render(ping,db,auth,store){
  const s=db.ok?db.r:null, dbLimit=PLAN.dbMB*MB, stLimit=PLAN.storageMB*MB;
  const dbPct=s?s.db_bytes/dbLimit*100:null, stPct=s&&s.storage_bytes!=null?s.storage_bytes/stLimit*100:null;
  let banner;
  if(!ping.ok) banner=['danger','bi-x-octagon','Die Datenbank ist nicht erreichbar.',(ping.err&&ping.err.message)||''];
  else if(!db.ok) banner=['warning','bi-exclamation-triangle','Die Datenbank läuft, aber der Statusbericht fehlt.','Wurde supabase-update-9.sql in Supabase ausgeführt? Fehler: '+((db.err&&db.err.message)||'')];
  else if(dbPct>=90||stPct>=90) banner=['danger','bi-exclamation-octagon','Der Speicher ist fast voll.','Bitte alte Daten aufräumen oder den Tarif wechseln.'];
  else if(dbPct>=70||stPct>=70) banner=['warning','bi-exclamation-triangle','Der Speicher füllt sich.','Behalte die Auslastung im Auge.'];
  else banner=['success','bi-check-circle','Alles läuft.','Datenbank, Anmeldung und Dateispeicher sind erreichbar, der Speicher ist ausreichend frei.'];
  let h=`<div class="alert alert-${banner[0]} d-flex align-items-start gap-3 shadow" role="status"><i class="bi ${banner[1]} fs-4" aria-hidden="true"></i><div><strong>${banner[2]}</strong><div class="small">${esc(banner[3])}</div></div></div>`;
  h+=`<div class="row g-3 mb-3">${serviceCard('Datenbank','database',ping)}${serviceCard('Anmeldung','person-lock',auth)}${serviceCard('Dateispeicher','hdd',store)}</div>`;
  if(s){
    h+=`<div class="row g-3 mb-3">${gaugeCard('Datenbank',dbPct,fmtBytes(s.db_bytes),PLAN.dbMB+' MB','belegt')}${
      stPct==null?'<div class="col-md-4"><div class="panel p-3 text-center h-100"><h2 class="h6 mb-2">Dateispeicher</h2><div class="text-secondary">Keine Angabe</div></div></div>':gaugeCard('Dateispeicher',stPct,fmtBytes(s.storage_bytes),(PLAN.storageMB>=1024?(PLAN.storageMB/1024)+' GB':PLAN.storageMB+' MB'),'belegt')}${
      s.connections==null?'':gaugeCard('Verbindungen',s.connections/s.max_connections*100,String(s.connections),String(s.max_connections),'aktiv')}</div>`;
    const c=s.counts;
    h+=`<div class="row g-3 mb-3">${fact('people','Accounts',s.accounts)}${fact('truck','Fahrzeuge',c.vehicles)}${fact('clipboard-check','Aufgaben',c.tasks)}${fact('info-circle','Infos',c.posts)}${fact('journal-text','Protokoll',c.logs,s.oldest_log?'ältester: '+fmtDate(s.oldest_log):'leer')}${fact('image','Profilbilder',s.storage_files??'–')}${fact('clock-history','Läuft seit',fmtDur(Date.now()-new Date(s.started_at).getTime()),fmtDate(s.started_at))}${fact('speedometer2','Zwischenspeicher-Trefferquote',s.cache_hit!=null?s.cache_hit+' %':'–','je höher, desto besser')}</div>`;
    const max=Math.max(1,...s.tables.map(t=>t.bytes));
    h+=`<div class="panel p-3"><h2 class="h6 mb-3"><i class="bi bi-table me-1" aria-hidden="true"></i> Tabellen</h2>${s.tables.map(t=>`<div class="mb-3"><div class="d-flex justify-content-between small"><span class="fw-semibold">${esc(t.name)}</span><span class="text-secondary">${t.rows} Zeilen · ${fmtBytes(t.bytes)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,t.bytes/max*100)}%"></div></div></div>`).join('')}<div class="small text-secondary">${esc(s.version)}</div></div>`;
  }
  $('statusWrap').innerHTML=h;
  $('checked').textContent='Zuletzt geprüft: '+new Date().toLocaleTimeString('de-DE');
}

async function load(){
  if(busy) return; busy=true;
  $('overlay').hidden=false;$('statusWrap').classList.add('busy');
  const [ping,db,auth,store]=await Promise.all([
    timed(async()=>{const {error}=await sb.from('profiles').select('id',{head:true,count:'exact'});if(error)throw error;return true}),
    timed(async()=>{const {data:d,error}=await sb.rpc('db_status');if(error)throw error;return d}),
    timed(async()=>{const r=await fetch(SUPABASE_URL+'/auth/v1/health',{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}),
    timed(async()=>{const {error}=await sb.storage.from('avatars').list(me.id,{limit:1});if(error)throw error;return true})
  ]);
  render(ping,db,auth,store);
  $('overlay').hidden=true;$('statusWrap').classList.remove('busy');busy=false;
}
function setAuto(on){
  clearInterval(timer);timer=null;
  try{localStorage.setItem('ls25_status_auto',on?'1':'0')}catch(e){}
  if(on) timer=setInterval(()=>{if(!document.hidden)load()},30000);
}
$('auto').addEventListener('change',e=>setAuto(e.target.checked));

/* Platzhalter, bis die Daten da sind */
$('topbar').innerHTML=skel.topbar();
$('statusWrap').innerHTML='<div class="row g-3">'+[1,2,3].map(()=>'<div class="col-md-4"><div class="panel p-3 placeholder-glow" role="status"><span class="placeholder col-6 d-block mb-2"></span><span class="placeholder col-8"></span></div></div>').join('')+'</div>';

init({roles:['chef','dev']}).then(()=>{
  data=DATA;me=ME;
  $('topbar').outerHTML=topbarHtml('status','Status',{fluid:false});
  let a=false;try{a=localStorage.getItem('ls25_status_auto')==='1'}catch(e){}
  $('auto').checked=a;setAuto(a);
  load();
});
</script>
</body>

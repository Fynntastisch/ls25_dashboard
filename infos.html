<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS25 Infos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--soil:#2b2118;--field:#4f6b3a;--barn:#8c3b2a;--hay:#e0b43a;--paper:#f3efe4;--ink:#241c14}
body{background:linear-gradient(rgba(243,239,228,.9),rgba(243,239,228,.9)),url(bg.jpg) center/cover fixed;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--soil);color:#f3efe4;border-bottom:4px solid var(--hay)}
.topbar .btn-outline-light{--bs-btn-border-color:#8a7a66}
.brand{font-weight:700}
.btn-hay{background:var(--hay);border-color:var(--hay);color:var(--ink);font-weight:600}
.btn-hay:hover{background:#c9a02e;border-color:#c9a02e}
.btn:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.panel{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1)}
.table th{font-weight:600;color:#6b5d4d;border-bottom-color:var(--soil)}
.role{border-radius:4px;padding:.1rem .5rem;font-size:.85rem;font-weight:600;background:#efe9d8}
.role.chef{background:var(--soil);color:var(--hay)}
.role.dev{background:var(--field);color:#fff}
.role.test{background:var(--barn);color:#fff}
.post{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1);padding:1.25rem 1.5rem;margin-bottom:1rem}
.post h2{font-size:1.35rem}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div id="topbar"></div>

<main class="container py-4" style="max-width:820px">
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <h1 class="h3 me-auto mb-0">Infos</h1>
    <button class="btn btn-hay" id="bNew" onclick="newPost()" hidden>Neuer Beitrag</button>
  </div>
  <div id="posts"></div>
</main>

<div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down"><form class="modal-content" onsubmit="savePost(event)">
  <div class="modal-header"><h5 class="modal-title" id="pTitle">Beitrag</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button></div>
  <div class="modal-body vstack gap-3">
    <input type="hidden" id="pId">
    <div><label class="form-label" for="pName">Titel</label><input class="form-control" id="pName" required></div>
    <div><label class="form-label" for="pBody">Text</label><textarea class="form-control" id="pBody" rows="10" required></textarea><div class="form-text">Zeilenumbrüche bleiben erhalten.</div></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Abbrechen</button><button class="btn btn-hay">Speichern</button></div>
</form></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script src="version.js"></script>
<script>
let data,me;
const save=()=>store.save(data);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});
function logout(){sb.auth.signOut().then(()=>location.href='index.html')}

function render(){
  const list=[...data.posts].sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  $('posts').innerHTML=list.length?list.map(p=>`<article class="post">
    <h2>${esc(p.title)}</h2>
    <div class="small text-secondary mb-2">Erstellt von ${esc(p.author?dispName(p.author):'Unbekannt')} · ${fmt(p.created)} Uhr${p.edited?`<br>Zuletzt bearbeitet von ${esc(dispName(p.edited))} · ${fmt(p.updated)} Uhr`:''}</div>
    <div class="body">${esc(p.body)}</div>
    ${can('posts','edit')||can('posts','delete')?`<div class="mt-3 d-flex gap-2">
      ${can('posts','edit')?`<button class="btn btn-sm btn-outline-dark" onclick="editPost(${p.id})">Bearbeiten</button>`:''}
      ${can('posts','delete')?`<button class="btn btn-sm btn-outline-danger" onclick="delPost(${p.id})">Löschen</button>`:''}</div>`:''}
  </article>`).join(''):'<div class="post text-center text-secondary">Noch keine Beiträge.</div>';
}

const pm=()=>bootstrap.Modal.getOrCreateInstance($('postModal'));
function newPost(){if(!can('posts','add'))return;$('pId').value='';$('pName').value='';$('pBody').value='';$('pTitle').textContent='Neuer Beitrag';pm().show()}
function editPost(id){const p=data.posts.find(x=>x.id===id);$('pId').value=id;$('pName').value=p.title;$('pBody').value=p.body;$('pTitle').textContent='Beitrag bearbeiten';pm().show()}
function savePost(e){e.preventDefault();
  const id=Number($('pId').value),now=new Date().toISOString(),title=$('pName').value.trim(),body=$('pBody').value.trim();
  if(id){const p=data.posts.find(x=>x.id===id);if(p.title!==title||p.body!==body)Object.assign(p,{title,body,updated:now,edited:me.name})}
  else data.posts.push({id:Date.now(),title,body,author:me.name,created:now,updated:now});
  save();pm().hide();render()}
function delPost(id){
  if(!can('posts','delete'))return;
  const p=data.posts.find(x=>x.id===id);
  if(confirm(`Beitrag „${p.title}“ wirklich löschen?`)){data.posts=data.posts.filter(x=>x.id!==id);save();render()}}

init().then(()=>{
  data=DATA;me=ME;
  $('topbar').outerHTML=topbarHtml('infos','Infos',{fluid:false});
  $('bNew').hidden=!can('posts','add');
  if(!can('posts','view')){$('posts').innerHTML='<div class="post text-center text-secondary">Du hast keinen Zugriff auf die Infos.</div>';return}
  render();
});
</script>
</body>

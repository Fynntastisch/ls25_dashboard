<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS25 Übersicht</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--soil:#2b2118;--field:#4f6b3a;--barn:#8c3b2a;--hay:#e0b43a;--paper:#f3efe4;--ink:#241c14}
body{background:linear-gradient(rgba(243,239,228,.9),rgba(243,239,228,.9)),url(bg.jpg) center/cover fixed;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--soil);color:#f3efe4;border-bottom:4px solid var(--hay)}
.topbar .btn-outline-light{--bs-btn-border-color:#8a7a66}
.brand{font-weight:700}
.btn-hay{background:var(--hay);border-color:var(--hay);color:var(--ink);font-weight:600}
.btn-hay:hover{background:#c9a02e;border-color:#c9a02e}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.panel{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1)}
a.stat{display:block;color:#fff;text-decoration:none;border-radius:6px;padding:1.25rem 1.5rem;transition:transform .15s}
a.stat:hover{transform:translateY(-3px);color:#fff}
.stat .n{font-size:2.5rem;font-weight:700;line-height:1}
.s-haupt{background:var(--field)}.s-neben{background:var(--barn)}.s-open{background:var(--soil)}.s-late{background:#b3261e}
.chip{background:#efe9d8;border-radius:4px;padding:0 .4rem;font-size:.82rem}
.chip.late{background:var(--barn);color:#fff}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<nav class="topbar"><div class="container py-2 d-flex flex-wrap align-items-center gap-2">
  <span class="brand">LS25 Dashboard <span class="opacity-75 fw-normal">· Übersicht</span></span>
  <span class="me-auto ms-3 d-flex gap-1 navl" id="navLinks"></span>
  <span class="small opacity-75" id="who"></span><button class="btn btn-sm btn-outline-light" onclick="openPw()">Passwort</button>
  <button class="btn btn-sm btn-hay" onclick="logout()">Abmelden</button>
</div></nav>

<main class="container py-4">
  <h1 class="h3 mb-4" id="hello"></h1>
  <div class="row g-3 mb-4" id="stats"></div>
  <div class="row g-4">
    <div class="col-lg-6"><div class="panel p-3 h-100"><h2 class="h5">Meine nächsten Aufgaben</h2><div id="mine"></div></div></div>
    <div class="col-lg-6"><div class="panel p-3 h-100"><h2 class="h5" id="lateTitle">Überfällig</h2><div id="late"></div></div></div>
  </div>
  <div class="panel p-3 mt-4"><h2 class="h5">Update-Logs</h2><div id="news"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<script src="version.js"></script>
<script>
let data,me;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date().toLocaleDateString('sv');
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
function logout(){sb.auth.signOut().then(()=>location.href='index.html')}

function boot(){
  $('news').innerHTML=CHANGELOG.slice(0,3).map(c=>`<div class="mb-3"><div><span class="badge text-bg-dark me-2">${esc(c.version)}</span><span class="fw-semibold">${esc(c.title)}</span> <span class="small text-secondary">· ${esc(c.date)}</span></div><ul class="mb-0 mt-1">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
  $('who').textContent=`${dispName(me.name)} (${me.role})`;
  $('navLinks').innerHTML=navLinks('uebersicht');
  $('hello').textContent=`Hallo ${dispName(me.name)}`;
  const open=data.tasks.filter(t=>t.status!=='Erledigt');
  const late=open.filter(t=>t.due&&t.due<today&&(me.role==='chef'||t.assignee===me.name));
  const mine=open.filter(t=>t.assignee===me.name).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const cnt=f=>data.vehicles.filter(v=>v.farm===f).length;
  $('stats').innerHTML=[
    ['s-haupt','dashboard.html#haupt',cnt('haupt'),'Fahrzeuge Hauptfarm'],
    ['s-neben','dashboard.html#neben',cnt('neben'),'Fahrzeuge Nebenfarm'],
    ['s-open','aufgaben.html',open.length,'Offene Aufgaben'],
    ['s-late','aufgaben.html',late.length,me.role==='chef'?'Überfällige Aufgaben':'Meine überfälligen']
  ].map(([c,h,n,l])=>`<div class="col-6 col-lg-3"><a class="stat ${c}" href="${h}"><div class="n">${n}</div>${l}</a></div>`).join('');
  if(me.role!=='chef') $('lateTitle').textContent='Meine überfälligen Aufgaben';
  const row=t=>`<a class="d-flex justify-content-between align-items-center py-2 border-bottom text-reset text-decoration-none" href="aufgaben.html">
    <span class="fw-semibold">${esc(t.title)}</span>
    <span>${t.assignee&&me.role==='chef'?`<span class="small text-secondary me-2">${esc(dispName(t.assignee))}</span>`:''}${t.due?`<span class="chip ${t.due<today?'late':''}">${fmt(t.due)}</span>`:''}</span></a>`;
  $('mine').innerHTML=mine.slice(0,6).map(row).join('')||'<p class="text-secondary mb-0">Dir sind keine offenen Aufgaben zugewiesen.</p>';
  $('late').innerHTML=late.slice(0,6).map(row).join('')||'<p class="text-secondary mb-0">Nichts überfällig.</p>';
}
init().then(()=>{data=DATA;me=ME;boot()});
</script>
</body>

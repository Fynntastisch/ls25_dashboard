<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS25 Übersicht</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--soil:#2b2118;--field:#4f6b3a;--barn:#8c3b2a;--hay:#e0b43a;--paper:#f3efe4;--ink:#241c14}
body{background:linear-gradient(rgba(243,239,228,.9),rgba(243,239,228,.9)),url(img/bg.jpg) center/cover fixed;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--soil);color:#f3efe4;border-bottom:4px solid var(--hay)}
.topbar .btn-outline-light{--bs-btn-border-color:#8a7a66}
.brand{font-weight:700}
.btn-hay{background:var(--hay);border-color:var(--hay);color:var(--ink);font-weight:600}
.btn-hay:hover{background:#c9a02e;border-color:#c9a02e}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.panel{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1)}
a.stat{display:block;color:#fff;text-decoration:none;border-radius:6px;padding:1.25rem 1.5rem;transition:transform .15s}
a.stat:hover{transform:translateY(-3px);color:#fff}
.stat .n{font-size:2.5rem;font-weight:700;line-height:1}
.s-haupt{background:var(--field)}.s-neben{background:var(--barn)}.s-open{background:var(--soil)}.s-late{background:#b3261e}
.chip{background:#efe9d8;border-radius:4px;padding:0 .4rem;font-size:.82rem}
.chip.late{background:var(--barn);color:#fff}
.news-link{color:#6b5d4d;text-decoration:none}
.news-link:hover,.news-link:focus-visible{color:#2b2118;text-decoration:underline}
</style>
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="topbar"></div>

<main class="container py-4">
  <section class="hero">
    <div class="hero-text">
      <h1 class="hero-title" id="hello">Willkommen zurück!</h1>
      <div class="hero-divider" aria-hidden="true"><i class="bi bi-suit-diamond-fill"></i></div>
      <p class="hero-sub" id="heroSub"><span class="placeholder-glow" aria-hidden="true"><span class="placeholder" style="width:240px"></span></span></p>
    </div>
    <div class="hero-tiles" id="stats"></div>
  </section>
  <div class="row g-4">
    <div class="col-lg-6"><div class="panel p-3 h-100">
      <div class="panel-head"><h2><i class="bi bi-check2-square" aria-hidden="true"></i> Nächste Aufgaben</h2><a class="small news-link" href="aufgaben.html">Alle anzeigen <i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
      <div id="mine"></div></div></div>
    <div class="col-lg-6"><div class="panel p-3 h-100">
      <div class="panel-head"><h2 id="lateTitle"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> Überfällig</h2><a class="small news-link" href="aufgaben.html">Alle anzeigen <i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
      <div id="late"></div></div></div>
  </div>
  <div class="panel p-3 mt-4">
    <div class="panel-head"><h2><i class="bi bi-megaphone" aria-hidden="true"></i> Update-Logs</h2><a class="small news-link" href="updatelogs.html">Alle anzeigen <i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
    <div id="news"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/version.js"></script>
<script>
let data,me;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date().toLocaleDateString('sv');
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
function logout(){sb.auth.signOut().then(()=>location.href='index.html')}

function boot(){
  $('news').innerHTML=CHANGELOG.slice(0,1).map(c=>`<div class="mb-3"><div><span class="badge text-bg-dark me-2">${esc(c.version)}</span><span class="fw-semibold">${esc(c.title)}</span> <span class="small text-secondary">· ${esc(c.date)}</span></div><ul class="mb-0 mt-1">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
  $('topbar').outerHTML=topbarHtml('uebersicht','Übersicht',{fluid:false});
  $('hello').textContent=`Willkommen zurück, ${dispName(me.name)}!`;
  const open=data.tasks.filter(t=>t.status!=='Erledigt');
  const late=open.filter(t=>t.due&&t.due<today&&(me.role==='chef'||(t.assignees||[]).includes(me.name)));
  const mine=open.filter(t=>(t.assignees||[]).includes(me.name)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  $('heroSub').textContent=mine.length?`Du hast ${mine.length} offene ${mine.length===1?'Aufgabe':'Aufgaben'}.`:'Du hast keine offenen Aufgaben.';
  const cnt=f=>data.vehicles.filter(v=>v.farm===f).length;
  $('stats').innerHTML=[
    ['t-haupt','dashboard.html#haupt',cnt('haupt'),'Fahrzeuge Hauptfarm','truck'],
    ['t-neben','dashboard.html#neben',cnt('neben'),'Fahrzeuge Nebenfarm','buildings'],
    ['t-open','aufgaben.html',open.length,'Offene Aufgaben','tools'],
    ['t-late','aufgaben.html',late.length,me.role==='chef'?'Überfällige Aufgaben':'Meine überfälligen','exclamation-circle']
  ].map(([c,h,n,l,i])=>`<a class="tile ${c}" href="${h}"><i class="bi bi-${i} tile-ic" aria-hidden="true"></i><span class="n">${n}</span><span class="l">${l}</span></a>`).join('');
  if(me.role!=='chef') $('lateTitle').innerHTML='<i class="bi bi-exclamation-circle" aria-hidden="true"></i> Meine überfälligen Aufgaben';
  const row=t=>`<a class="d-flex justify-content-between align-items-center py-2 border-bottom text-reset text-decoration-none" href="aufgaben.html">
    <span class="fw-semibold">${esc(t.title)}</span>
    <span>${me.role==='chef'&&(t.assignees||[]).length?`<span class="small text-secondary me-2">${esc(t.assignees.map(dispName).join(', '))}</span>`:''}${t.due?`<span class="chip ${t.due<today?'late':''}">${fmt(t.due)}</span>`:''}</span></a>`;
  $('mine').innerHTML=mine.slice(0,6).map(row).join('')||'<p class="text-secondary mb-0">Dir sind keine offenen Aufgaben zugewiesen.</p>';
  $('late').innerHTML=late.slice(0,6).map(row).join('')||'<p class="text-secondary mb-0">Nichts überfällig.</p>';
}
/* Platzhalter, bis die Daten da sind */
$('topbar').innerHTML=skel.topbar();$('stats').innerHTML=skel.tiles();$('mine').innerHTML=skel.rows(3);$('late').innerHTML=skel.rows(3);$('news').innerHTML=skel.rows(2);
init().then(()=>{data=DATA;me=ME;boot()});
</script>
</body>

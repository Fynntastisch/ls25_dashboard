<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elmcreek Ranch – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18110a">
<link rel="icon" type="image/png" href="img/icons/icon-192.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elmcreek">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <div class="wrapper">
    <img class="login-logo" src="img/logo-login.png" alt="Elmcreek Ranch">
    <form id="loginForm">
      <h1>Login</h1>
      <p id="loginError" class="error" role="alert" hidden></p>
      <div class="input-box">
        <input type="text" id="loginUser" placeholder="Benutzername" autocomplete="username" required>
        <i class="bi bi-person-fill" aria-hidden="true"></i>
      </div>
      <div class="input-box">
        <input type="password" id="loginPassword" placeholder="Passwort" autocomplete="current-password" required>
        <i class="bi bi-lock-fill" aria-hidden="true"></i>
      </div>
      <button type="submit" class="btn">Login <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
      <p class="hint">Passwort vergessen? Wende dich an den Chef oder einen Developer.</p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
  <script src="js/version.js"></script>
<script src="js/pwa.js"></script>
  <script src="js/script.js"></script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS25 Update-Logs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--soil:#2b2118;--field:#4f6b3a;--barn:#8c3b2a;--hay:#e0b43a;--paper:#f3efe4;--ink:#241c14}
body{background:linear-gradient(rgba(243,239,228,.9),rgba(243,239,228,.9)),url(img/bg.jpg) center/cover fixed;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.topbar{background:var(--soil);color:#f3efe4;border-bottom:4px solid var(--hay)}
.topbar .btn-outline-light{--bs-btn-border-color:#8a7a66}
.brand{font-weight:700}
.btn-hay{background:var(--hay);border-color:var(--hay);color:var(--ink);font-weight:600}
.btn-hay:hover{background:#c9a02e;border-color:#c9a02e}
.btn:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.panel{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1)}
.table th{font-weight:600;color:#6b5d4d;border-bottom-color:var(--soil)}
.role{border-radius:4px;padding:.1rem .5rem;font-size:.85rem;font-weight:600;background:#efe9d8}
.role.chef{background:var(--soil);color:var(--hay)}
.role.dev{background:var(--field);color:#fff}
.role.test{background:var(--barn);color:#fff}
.post{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(43,33,24,.1);padding:1.25rem 1.5rem;margin-bottom:1rem}
.post h2{font-size:1.35rem}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere}
.accordion-body ul{list-style:disc;padding-left:1.25rem;margin-bottom:0}
</style>
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="topbar"></div>

<main class="container py-4" style="max-width:820px">
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <h1 class="h3 me-auto mb-0">Update-Logs</h1>
    <a class="btn btn-hay" href="uebersicht.html">Zurück zur Übersicht</a>
  </div>
  <div class="accordion" id="logAcc"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/version.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logout(){sb.auth.signOut().then(()=>location.href='index.html')}
init().then(()=>{
  $('topbar').outerHTML=topbarHtml('','Update-Logs',{fluid:false});
  $('logAcc').innerHTML=CHANGELOG.map((c,i)=>`<div class="accordion-item">
    <h2 class="accordion-header"><button class="accordion-button ${i?'collapsed':''}" type="button" data-bs-toggle="collapse" data-bs-target="#c${i}" aria-expanded="${i?'false':'true'}" aria-controls="c${i}">
      <span class="badge text-bg-dark me-2">${esc(c.version)}</span><span class="fw-semibold">${esc(c.title)}</span><span class="ms-2 small text-secondary">${esc(c.date)}</span></button></h2>
    <div id="c${i}" class="accordion-collapse collapse ${i?'':'show'}" data-bs-parent="#logAcc"><div class="accordion-body"><ul>${c.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div></div>`).join('');
});
</script>
</body>
